<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <meta name="robots" content="noindex, nofollow">
  <title>Сайт временно недоступен</title>
  <style>
    :root{color-scheme:dark;--bg:#070708;--text:#f4f3f7;--muted:#a4a3af;--violet:#a78bfa;--pink:#e879f9}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,Manrope,Arial,sans-serif}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 78% 25%,rgba(139,92,246,.13),transparent 34%),radial-gradient(ellipse at 16% 80%,rgba(217,70,239,.07),transparent 32%),#070708}
    .grid{position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}
    .shape{position:fixed;pointer-events:none;opacity:.5;animation:float 18s ease-in-out infinite}
    .shape.one{width:min(40vw,440px);aspect-ratio:1;left:-13vw;top:16vh;border:1px solid rgba(196,181,253,.2);border-radius:50%;box-shadow:inset 0 0 0 40px rgba(139,92,246,.012),inset 0 0 0 80px rgba(139,92,246,.012)}
    .shape.two{width:120px;height:120px;right:12vw;bottom:15vh;border:1px solid rgba(232,121,249,.25);transform:rotate(45deg);animation-delay:-6s}
    .shape.three{width:0;height:0;right:24vw;top:14vh;border-left:42px solid transparent;border-right:42px solid transparent;border-bottom:74px solid rgba(139,92,246,.08);animation-delay:-10s}
    @keyframes float{0%,100%{translate:0 0;rotate:0deg}50%{translate:10px -16px;rotate:8deg}}
    main{position:relative;width:min(100%,650px);padding:clamp(30px,7vw,64px);text-align:center;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 110px rgba(0,0,0,.28)}
    .mark{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 32px;border:1px solid rgba(196,181,253,.5);border-radius:50%;font-size:14px;font-weight:700;color:#e9d5ff;letter-spacing:-.06em}
    .label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}
    h1{margin:20px 0 18px;font-size:clamp(34px,7vw,60px);font-weight:500;letter-spacing:-.065em;line-height:.98}
    p{margin:0 auto;max-width:410px;color:var(--muted);font-size:15px;line-height:1.8}
    .line{width:58px;height:2px;margin:30px auto 0;background:linear-gradient(90deg,var(--pink),var(--violet))}
    @media(max-width:520px){.shape.two{width:76px;height:76px;right:5vw}.shape.three{right:9vw}main{padding:34px 24px}.mark{margin-bottom:25px}p{font-size:14px}}
    @media(prefers-reduced-motion:reduce){.shape{animation:none}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="shape one" aria-hidden="true"></div>
  <div class="shape two" aria-hidden="true"></div>
  <div class="shape three" aria-hidden="true"></div>
  <main>
    <div class="mark" aria-hidden="true">ТВ</div>
    <div class="label">Татьяна Верг</div>
    <h1>Сайт временно недоступен</h1>
    <p>Страница временно закрыта. Пожалуйста, зайдите позже.</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
